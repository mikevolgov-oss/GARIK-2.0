plugins { id 'com.android.application' }

android {
    namespace 'com.garik.os'
    compileSdk 35

    signingConfigs {
        debug {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'com.garik.os'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '2.0.2'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
