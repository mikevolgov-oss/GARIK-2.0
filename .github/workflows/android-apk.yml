name: Build GARIK OS 2.1.2 APK
# Pipeline builds the root Vosk project and verifies its ARM64 native library.

on:
  push:
    branches: [ main, fix/garik-wakeword-2-1-2 ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode signing/debug.keystore.base64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Build Vosk-enabled APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK contains Vosk native engine
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          test "$SIZE" -gt 1000000
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libvosk.so'
          echo "Vosk ARM64 native library found."
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GARIK-OS-2.1.2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
