name: Build GARIK OS APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore and verify stable signing key
        run: |
          mkdir -p signing
          base64 --decode signing/debug.keystore.base64 > signing/debug.keystore
          chmod 600 signing/debug.keystore
          keytool -list -v -keystore signing/debug.keystore -storepass android -alias androiddebugkey | grep -E 'SHA256:'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Verify APK signing certificate
        run: |
          apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GARIK-OS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
