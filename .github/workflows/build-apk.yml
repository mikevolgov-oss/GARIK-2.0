name: Build GARIK OS APK

on:
  push:
    branches:
      - garik-wakeword-safe
      - hcnsec-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore and verify stable signing key
        run: |
          test -s signing/debug.keystore.base64
          mkdir -p signing
          base64 --decode signing/debug.keystore.base64 > signing/debug.keystore
          chmod 600 signing/debug.keystore
          keytool -list -v -keystore signing/debug.keystore -storepass android -alias androiddebugkey | grep -E 'SHA256:'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signing certificate
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -E 'Signer #1 certificate SHA-256 digest'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GARIK-OS-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
